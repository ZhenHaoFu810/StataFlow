[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "StataFlow"
version = "1.1.0"
description = "StataFlow: A Python econometrics toolkit aligned with Stata 17"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Zhenhao Fu", email = "zhenhaofu2001@gmail.com"}]
keywords = ["econometrics", "stata", "regression", "fixed-effects", "panel-data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<2.2",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "statsmodels>=0.14",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/ZhenHaoFu810/StataFlow"
Repository = "https://github.com/ZhenHaoFu810/StataFlow"
Issues = "https://github.com/ZhenHaoFu810/StataFlow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that are slow or computationally expensive",
    "golden: Stata-Python dual-run golden tests requiring local Stata 17",
    "stata: tests that require a local Stata 17 installation",
    "benchmark: performance benchmark tests",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# Baseline lint gate: enforce syntax errors and obvious Pyflakes issues.
# Additional rules (isort, naming, pyupgrade, bugbear) will be phased in
# after an initial formatting pass.
select = [
    "E9",  # pycodestyle syntax errors
    "F",   # Pyflakes
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Mypy is enforced in CI as a formatting/structure gate. Full strictness is
# deferred until the core estimators have complete type annotations; for now
# errors are logged but do not fail the build.
ignore_errors = true
exclude = [
    "build/",
    "dist/",
    '\.venv/',
]
