# Open-Source Export Manifest — v2.1.0
#
# Clean user-facing export: core source, examples, tests, user docs,
# public datasets, and validation evidence.
# No development docs, scripts, Stata artifacts, or golden tests.
# ---------------------------------------------------------------------------

meta:
  source_repo: "StataFlow"
  target_repo: "StataFlow_open_source"
  manifest_version: "2.2.0"

whitelist:
  files:
    - "README.md"
    - "README.zh-CN.md"
    - "LICENSE"
    - "pyproject.toml"
    - ".gitignore"
    - ".gitattributes"
    - ".pre-commit-config.yaml"
    - "CHANGELOG.md"
    - "VALIDATION.md"

  directories:
    - "src/stataflow/"
    - "examples/"
    - "tests/"
    - "research/data/public/"
    - "research/results/validation/"

  specific_files:
    - "docs/USER_GUIDE.md"
    - "docs/USER_GUIDE.zh-CN.md"
    - "docs/cookbook.md"
    - "docs/cookbook.zh-CN.md"
    - "docs/release/open-source-status.md"
    - "docs/release/open-source-update-log-1.1.0.md"
    - "docs/release/known-issues.md"
    - "docs/release/release-candidate-checklist.md"
    - ".github/workflows/ci.yml"
    - "scripts/release/PRE_PUBLIC_SYNC_CHECKLIST.md"

blacklist:
  patterns:
    - "__pycache__/**"
    - "*.pyc"
    - "*.egg-info/**"
    - ".pytest_cache/**"
    - "build/**"
    - "dist/**"
    - "*.log"
    - "*.tmp"
    - "*token*"
    - "*secret*"
    - "*credential*"
    - "tests/golden/**"
    - "tests/audit_v1_3/**"
    - "tests/test_validation_summary.py"
    - "tests/test_export_safety.py"
    - "workspace/**"
    - ".claude/**"
    - "session_restore/**"
    - "docs/audit/**"
