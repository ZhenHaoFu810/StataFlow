# Open-Source Export Manifest — v2.0.0
#
# Minimal export: core source, examples, user docs, validation evidence.
# No tests, research data, development docs, or Stata artifacts.
# ---------------------------------------------------------------------------

meta:
  source_repo: "StataFlow"
  target_repo: "StataFlow_open_source"
  manifest_version: "2.0.0"

whitelist:
  files:
    - "README.md"
    - "README.zh-CN.md"
    - "LICENSE"
    - "pyproject.toml"
    - ".gitignore"
    - "VALIDATION.md"

  directories:
    - "src/stataflow/"
    - "examples/"

  specific_files:
    - "docs/USER_GUIDE.md"
    - "docs/USER_GUIDE.zh-CN.md"
    - "docs/cookbook.md"
    - "docs/cookbook.zh-CN.md"
    - ".github/workflows/ci.yml"

blacklist:
  patterns:
    - "__pycache__/**"
    - "*.pyc"
    - "*.egg-info/**"
    - ".pytest_cache/**"
    - "build/**"
    - "dist/**"
    - "*.log"
    - "*.tmp"
    - "*token*"
    - "*secret*"
    - "*credential*"
