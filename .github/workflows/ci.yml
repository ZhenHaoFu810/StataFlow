name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pip check

      - name: Lint and type check
        run: |
          ruff check src tests
          mypy src

      - name: Import smoke
        run: |
          python -c "import stataflow; assert stataflow.__version__ == '1.3.1', stataflow.__version__"
          python -c "from importlib.metadata import version; assert version('StataFlow') == '1.3.1', version('StataFlow')"

      - name: Run unit and integration tests
        run: |
          pytest tests/ -v --ignore=tests/stata_validation --cov=stataflow --cov-report=term-missing --timeout=300

      - name: Collect and compile Stata validation cases (no Stata execution)
        run: |
          pytest tests/stata_validation --collect-only -q
          python -m compileall -q tests/stata_validation

      - name: Run example smoke tests
        run: |
          # All nine demos run with no network and no local Stata dependency.
          # Each script is deterministic (seeded) and must exit with code zero.
          python examples/demo_regress.py
          python examples/demo_panel_fe.py
          python examples/demo_reghdfe.py
          python examples/demo_ivregress_2sls.py
          python examples/demo_ivreghdfe.py
          python examples/demo_glm.py
          python examples/demo_ppmlhdfe.py
          python examples/demo_did.py
          python examples/demo_rdrobust.py

      - name: Build sdist and wheel
        run: |
          python -m build --sdist --wheel --outdir dist_tmp

      - name: Verify clean wheel install
        run: |
          python -m venv clean_venv
          source clean_venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist_tmp/stataflow-*.whl
          python -m pip check
          cd clean_venv
          python -c "import pathlib, stataflow; path = pathlib.Path(stataflow.__file__).resolve(); assert stataflow.__version__ == '1.3.1', stataflow.__version__; assert 'site-packages' in str(path), path"
          python -c "from importlib.metadata import version; assert version('StataFlow') == '1.3.1', version('StataFlow')"
