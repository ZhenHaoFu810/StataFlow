name: PyPI install smoke

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected stable StataFlow version on PyPI
        required: true
        default: "1.3.1"

jobs:
  install:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the unpinned stable release
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir StataFlow
          python -m pip check

      - name: Verify the selected release
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: >-
          python -c "import os, pathlib, stataflow; from importlib.metadata import version;
          expected = os.environ['EXPECTED_VERSION']; installed = version('StataFlow');
          path = pathlib.Path(stataflow.__file__).resolve();
          assert installed == expected, (installed, expected);
          assert stataflow.__version__ == expected, stataflow.__version__;
          assert 'site-packages' in str(path), path;
          print(f'StataFlow {installed} from {path}')"
